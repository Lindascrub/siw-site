<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Movies')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 600px;">
    <h1 th:text="${movieForm.id} == null ? 'New movie' : 'Edit movie'">Movie</h1>
    <form th:action="@{/admin/movies/save}" th:object="${movieForm}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-2">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Year</label>
            <input type="number" class="form-control" th:field="*{year}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" class="form-control" th:field="*{duration}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Genre</label>
            <input class="form-control" th:field="*{genre}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Country of production</label>
            <input class="form-control" th:field="*{contryProduction}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Director</label>
            <select class="form-select" th:field="*{directorId}">
                <option th:each="d : ${directors}" th:value="${d.id}" th:text="${d.name} + ' ' + ${d.surname}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
</body>
</html>
