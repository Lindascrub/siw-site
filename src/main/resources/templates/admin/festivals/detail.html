<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${festival.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <h1 th:text="${festival.name}">Festival name</h1>
    <p class="text-muted" th:text="${festival.city} + ' | ' + ${festival.startDate} + ' \u2192 ' + ${festival.endDate}"></p>
    <p th:text="${festival.description}">Description</p>

    <a class="btn btn-outline-primary mb-3" th:href="@{/festivals/{id}/programms(id=${festival.id})}">Screening program</a>

    <h3>Movies</h3>
    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col" th:each="m : ${movie}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${m.title}">Title</h5>
                    <p class="card-text" th:text="${m.genre} + ' - ' + ${m.year}">Genre - Year</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/movies/{id}(id=${m.id})}">Details</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(movie)}" class="text-muted">No movies associated yet.</p>
</div>
</body>
</html>
