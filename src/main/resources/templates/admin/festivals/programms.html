<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Program - ' + ${festival.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <h1 th:text="'Program - ' + ${festival.name}">Program</h1>

    <a sec:authorize="hasRole('ADMIN')" class="btn btn-success mb-3" th:href="@{/admin/screenings/new(festivalId=${festival.id})}">
        + New screening
    </a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Movie</th>
            <th>Hall</th>
            <th>Status</th>
            <th sec:authorize="hasRole('ADMIN')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${screenings}">
            <td th:text="${s.date}">Date</td>
            <td th:text="${s.time}">Time</td>
            <td><a th:href="@{/movies/{id}(id=${s.movie.id})}" th:text="${s.movie.title}">Movie</a></td>
            <td th:text="${s.hall.name}">Hall</td>
            <td th:text="${s.status}">Status</td>
            <td sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/screenings/{id}/edit(id=${s.id})}">Edit</a>
                <form th:action="@{/admin/screenings/{id}/delete(id=${s.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(screenings)}" class="text-muted">No screenings scheduled.</p>
</div>
</body>
</html>
