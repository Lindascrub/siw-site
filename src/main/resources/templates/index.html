<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Festivals')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <h1 class="mb-4">Movie Festivals</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="f : ${festivals}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${f.name}">Name</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${f.city} + ' - ' + ${f.year}">City - Year</h6>
                    <p class="card-text" th:text="${f.startDate} + ' \u2192 ' + ${f.endDate}">Dates</p>
                    <a class="btn btn-primary" th:href="@{/festivals/{id}(id=${f.id})}">Details</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(festivals)}" class="text-muted">No festivals available.</p>
</div>
</body>
</html>
