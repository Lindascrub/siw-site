<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <title th:text="${title} + ' - Movie Festival'">Movie Festival</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Movie Festival</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/}">Festivals</a>
            <a class="nav-link" th:href="@{/react/}">React App</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/festivals}">Admin Festivals</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/movies}">Admin Movies</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/directors}">Admin Directors</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/halls}">Admin Halls</a>
        </div>
        <div class="navbar-nav">
            <span class="navbar-text text-light me-3" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
            <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm me-2" th:href="@{/auth/login}">Login</a>
            <a sec:authorize="isAnonymous()" class="btn btn-light btn-sm" th:href="@{/auth/register}">Register</a>
        </div>
    </div>
</nav>
</body>
</html>
