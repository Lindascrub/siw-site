<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Halls')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 600px;">
    <h1 th:text="${hallForm.id} == null ? 'New hall' : 'Edit hall'">Hall</h1>
    <form th:action="@{/admin/halls/save}" th:object="${hallForm}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-2">
            <label class="form-label">Name</label>
            <input class="form-control" th:field="*{name}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Address</label>
            <input class="form-control" th:field="*{address}"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Capacity</label>
            <input type="number" class="form-control" th:field="*{capacity}"/>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
</body>
</html>
